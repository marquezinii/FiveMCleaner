## FiveMCleaner anonymous telemetry + admin dashboard API Worker.
##
## Receives the same closed-allowlist telemetry event already documented in
## docs/telemetry.md, validates it server-side (never trusting client-side
## validation alone), and stores it in D1. Also serves the authenticated
## /api/stats/* endpoints the dashboard (infra/dashboard/) reads from, and
## the custom admin login/logout used to protect them.
##
## DEPLOYED: a single Worker instance (this top-level, unnamed environment)
## handles both Development- and Production-tagged telemetry -- the
## `environment` column on each row is what separates them for the
## dashboard's filters, not a second deployed Worker. The `env.development`/
## `env.production` sections below were an earlier, more elaborate design
## (mirroring how Sentry environments work) that turned out to add no real
## benefit here, since D1 already distinguishes rows by that column; they
## are kept, unused, in case a genuine need for physically separate
## deployments comes up later, but `wrangler deploy` (no --env) is what is
## actually live at:
##   https://fivemcleaner-telemetry.felipemarquesini10.workers.dev
##
## The .NET client is fully wired to send both anonymous telemetry
## (`POST /telemetry`, live and working since this Worker was first
## deployed) and bug reports (`POST /bugs`, code-complete but NOT live yet --
## see below) to this Worker. FormSubmit was removed entirely as a
## transport for both; there is no fallback if this Worker is unreachable.
##
## `/bugs` requires a redeploy plus the R2 bucket below to exist before it
## actually works -- neither has been done from this environment (no deploy
## was authorized in the session that wrote this route; see README.md for
## the exact commands to run before relying on bug reports in production).
##
## Required secrets (already set on the deployed Worker via
## `wrangler secret put <NAME>`, NEVER written to this file or committed):
##   ADMIN_PASSWORD_HASH -- output of `npm run hash-admin-password`
##   IP_HASH_SECRET      -- a long random string, used only to keep
##                          brute-force tracking from storing a raw IP
##
## DASHBOARD_ORIGIN below is a plain, non-secret var -- the exact origin the
## dashboard is served from, so CORS headers are only ever sent back to that
## one origin. Safe to commit (it is not a credential). For local testing,
## override it per-machine in a git-ignored `.dev.vars` file instead of
## editing this one -- see README.md.
##
## See README.md for the full setup walkthrough.

name = "fivemcleaner-telemetry"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
DASHBOARD_ORIGIN = "https://fivemcleaner-dashboard.pages.dev"

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "fivemcleaner-telemetry"
database_id = "fe276121-a71a-4ba4-ab62-81cccdf601c6"

# NOT created yet -- `wrangler r2 bucket create fivemcleaner-bug-reports`
# must run (with authorization) before this binding resolves to a real
# bucket. Stores only the optional sanitized screenshot bytes for a bug
# report; the report itself (text fields) always lives in D1's bug_reports
# table, with `attachment_key` pointing at the matching R2 object.
[[r2_buckets]]
binding = "BUG_REPORT_ATTACHMENTS"
bucket_name = "fivemcleaner-bug-reports"

# Unused today (see note above) -- kept for a possible future need to
# physically separate deployments instead of just tagging rows.
[env.development]
name = "fivemcleaner-telemetry-development"

[env.development.vars]
DASHBOARD_ORIGIN = ""

[[env.development.d1_databases]]
binding = "TELEMETRY_DB"
database_name = "fivemcleaner-telemetry"
database_id = "fe276121-a71a-4ba4-ab62-81cccdf601c6"

[env.production]
name = "fivemcleaner-telemetry-production"

[env.production.vars]
DASHBOARD_ORIGIN = ""

[[env.production.d1_databases]]
binding = "TELEMETRY_DB"
database_name = "fivemcleaner-telemetry"
database_id = "fe276121-a71a-4ba4-ab62-81cccdf601c6"
